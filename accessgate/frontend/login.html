<!DOCTYPE html>
<html>
<head>
  <title>AccessGate Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card p-4 shadow">
        <h4 class="text-center mb-3">AccessGate Login</h4>

        <input id="username" class="form-control mb-2" placeholder="Username">
        <input id="password" type="password" class="form-control mb-3" placeholder="Password">

        <button class="btn btn-primary w-100" onclick="login()">Login</button>

        <!-- NEW LINKS -->
        <div class="d-flex justify-content-between mt-3">
          <a href="/register/">Sign up</a>
          <a href="/forgot/">Forgot password?</a>
        </div>

        <p id="msg" class="text-danger mt-2"></p>
      </div>
    </div>
  </div>
</div>

<script>
function login() {
  fetch("http://127.0.0.1:8000/api/accounts/login/", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    })
  })
  .then(res => res.json())
  .then(data => {
    if(data.access){
      localStorage.setItem("token", data.access);
      window.location.href = "/dashboard/";
    } else {
      document.getElementById("msg").innerText = "Login failed";
    }
  });
}
</script>

</body>
</html>
