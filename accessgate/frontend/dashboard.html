<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-dark bg-dark p-3">
  <span class="navbar-brand">AccessGate</span>
  <button class="btn btn-danger" onclick="logout()">Logout</button>
</nav>
<p id="userInfo" class="text-muted"></p>

<div class="container mt-4">
  <h3>Welcome to AccessGate</h3>
  <p>This dashboard proves your JWT & RBAC are working.</p>

  <a href="/roles/" class="btn btn-primary">Manage Roles</a>
  <a href="/permissions/" class="btn btn-secondary">Manage Permissions</a>
</div>

<script>

function logout(){
  localStorage.removeItem("token");
  window.location.href = "/";
}

fetch("/api/accounts/me/", {
  headers:{
    "Authorization":"Bearer " + localStorage.getItem("token")
  }
})
.then(r=>r.json())
.then(d=>{
  document.getElementById("userInfo").innerText =
    `Logged in as ${d.username} (${d.role})`;
});

</script>

</body>
</html>
