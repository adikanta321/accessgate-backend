<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="col-md-4 mx-auto card p-4 shadow">
    <h4 class="text-center mb-3">Create Account</h4>

    <input id="username" class="form-control mb-2" placeholder="Username">
    <input id="email" class="form-control mb-2" placeholder="Email">
    <input id="password" type="password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-success w-100" onclick="register()">Register</button>

    <p id="msg" class="mt-2 text-center"></p>

    <div class="text-center mt-3">
      <a href="/">Back to Login</a>
    </div>
  </div>
</div>

<script>
function register(){
  fetch("/api/accounts/register/", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: document.getElementById("username").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    })
  })
  .then(r => r.json())
  .then(d => {
    if(d.message){
      document.getElementById("msg").innerText = "Registration successful! You can login.";
    } else {
      document.getElementById("msg").innerText = "Error creating account.";
    }
  });
}
</script>

</body>
</html>
