<!DOCTYPE html>
<html>
<head>
  <title>Roles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<h3>Create Role</h3>

<input id="role" class="form-control mb-2" placeholder="Role name">
<button class="btn btn-success" onclick="createRole()">Create</button>

<hr>

<h4>Existing Roles</h4>
<ul id="roleList" class="list-group"></ul>

<script>
const token = localStorage.getItem("token");

function loadRoles(){
  fetch("http://127.0.0.1:8000/api/roles/roles/", {
    headers: {
      "Authorization": "Bearer " + token
    }
  })
  .then(res => res.json())
  .then(data => {
    const list = document.getElementById("roleList");
    list.innerHTML = "";
    data.forEach(r => {
      const li = document.createElement("li");
      li.className = "list-group-item";
      li.innerText = r.name;
      list.appendChild(li);
    });
  });
}

function createRole(){
  fetch("http://127.0.0.1:8000/api/roles/roles/", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer " + token
    },
    body: JSON.stringify({name: document.getElementById("role").value})
  })
  .then(res => res.json())
  .then(() => {
    document.getElementById("role").value = "";
    loadRoles();
  });
}

loadRoles();
</script>

</body>
</html>
