<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="col-md-4 mx-auto card p-4 shadow">
    <h4 class="text-center mb-3">Reset Password</h4>

    <input id="pass" type="password" class="form-control mb-3" placeholder="New password">
    <button class="btn btn-success w-100" onclick="reset()">Reset Password</button>

    <p id="msg" class="mt-2 text-center"></p>
  </div>
</div>

<script>
const token = new URLSearchParams(window.location.search).get("token");

function reset(){
  fetch("/api/accounts/reset-password/", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      token: token,
      password: document.getElementById("pass").value
    })
  })
  .then(r => r.json())
  .then(d => {
    document.getElementById("msg").innerText = "Password reset successful!";
  });
}
</script>

</body>
</html>
