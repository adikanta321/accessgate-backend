<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="col-md-4 mx-auto card p-4 shadow">
    <h4 class="text-center mb-3">Forgot Password</h4>

    <input id="email" class="form-control mb-3" placeholder="Enter your email">
    <button class="btn btn-primary w-100" onclick="sendLink()">Send Reset Link</button>

    <p id="msg" class="text-success mt-2 text-center"></p>
  </div>
</div>

<script>
function sendLink(){
  fetch("/api/accounts/forgot-password/", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      email: document.getElementById("email").value
    })
  })
  .then(r => r.json())
  .then(d => {
    document.getElementById("msg").innerText =
      "If the email exists, a reset link has been sent.";
  });
}
</script>

</body>
</html>
